name: Craft CI/CD Production Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-sqlite:
    name: Pytest (SQLite) — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        working-directory: data
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: data
        run: |
          ruff check .

      - name: Run Pytest Suite (SQLite, with coverage)
        working-directory: data
        run: |
          python -m pytest --cov=engine --cov-report=term-missing

  test-postgres:
    name: Pytest (PostgreSQL) — Python 3.11
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: craft
          POSTGRES_PASSWORD: secretpassword
          POSTGRES_DB: craft_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U craft"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        working-directory: data
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest Suite (PostgreSQL, with coverage)
        working-directory: data
        env:
          CRAFT_TEST_DB: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: craft_validation
          DB_USERNAME: craft
          DB_PASSWORD: secretpassword
        run: |
          python -m pytest --cov=engine --cov-report=term-missing

  docker-build:
    name: Build Production Docker Image
    needs: [test-sqlite, test-postgres]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Production Image
        uses: docker/build-push-action@v4
        with:
          context: ./data
          file: ./data/Dockerfile.prod
          push: false
          tags: craft-framework:latest
