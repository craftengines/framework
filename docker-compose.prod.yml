version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: framework-prod-db
    environment:
      POSTGRES_USER: ${DB_USERNAME:-craft}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secretpassword}
      POSTGRES_DB: ${DB_DATABASE:-craft_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-craft} -d ${DB_DATABASE:-craft_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: framework-prod-app
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-craft_prod}
      - DB_USERNAME=${DB_USERNAME:-craft}
      - DB_PASSWORD=${DB_PASSWORD:-secretpassword}
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
