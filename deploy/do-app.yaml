# version: 1.2.0 | build: 2026-09-18 | update: 2026-09-19
# DigitalOcean App Platform spec for craftengine.org: two static sites, no
# database, no server runtime. Applied only through .claude/scripts/do-app.py,
# which refuses to touch any app but this one.
#   /      the presentation site, private repository msrjson/craftengine.org
#   /docs  the framework documentation, built from documentation/ here
name: craftengine-website
static_sites:
  - name: site
    github:
      repo: msrjson/craftengine.org
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    output_dir: /site
    index_document: index.html
    error_document: 404.html
  - name: docs
    github:
      repo: msrjson/craftengine
      branch: master
      deploy_on_push: true
    dockerfile_path: deploy/docs.Dockerfile
    output_dir: /site
    index_document: index.html
ingress:
  rules:
    # The docs component is served with the /docs prefix stripped; its pages
    # link relatively, so every link into it ends in a slash (/docs/).
    - match:
        path:
          prefix: /docs
      component:
        name: docs
    # The MSR JSON manifest (https://msrjson.org) is read cross-origin by
    # registries and agents, so this prefix answers any origin. The prefix is
    # kept: the site component stores the file under /.well-known/.
    - match:
        path:
          prefix: /.well-known
      component:
        name: site
        preserve_path_prefix: true
      cors:
        allow_origins:
          - regex: ".*"
        allow_methods:
          - GET
          - HEAD
    - match:
        path:
          prefix: /
      component:
        name: site
domains:
  - domain: craftengine.org
    type: PRIMARY
  - domain: www.craftengine.org
    type: ALIAS
