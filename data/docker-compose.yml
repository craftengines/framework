# Explicit project name — the directory is "craft engine" and Compose would
# otherwise derive the project (and volume/network prefixes) from that space.
name: framework

services:
  db:
    image: postgres:15-alpine
    container_name: framework-db
    ports:
      - "5499:5499"
    environment:
      POSTGRES_USER: ${DB_USERNAME:-craft}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secretpassword}
      POSTGRES_DB: ${DB_DATABASE:-craft_db}
      PGPORT: 5499
    volumes:
      # Named volume so recreating the container does not wipe the database.
      - framework_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 5499 -U ${DB_USERNAME:-craft} -d ${DB_DATABASE:-craft_db}"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: framework
    ports:
      - "8300:8000"
    volumes:
      - .:/app
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5499
      - DB_DATABASE=${DB_DATABASE:-craft_db}
      - DB_USERNAME=${DB_USERNAME:-craft}
      - DB_PASSWORD=${DB_PASSWORD:-secretpassword}
      - PYTHONPATH=/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  framework_db_data:
