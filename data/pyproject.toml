[build-system]
# 77+ is required for PEP 639 metadata (`license` as an SPDX string plus
# `license-files`). Older setuptools rejects it.
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "craft"
version = "3.11.0"
description = "A batteries-included Python web framework built on Starlette"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Antonio Santos", email = "snarthost@gmail.com" }]
maintainers = [{ name = "Antonio Santos", email = "snarthost@gmail.com" }]
keywords = ["framework", "web", "mvc", "orm", "starlette", "asgi", "active-record"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.104.0",
    "starlette>=0.27.0",
    "uvicorn[standard]>=0.24.0",
    "jinja2>=3.1",
    "typer>=0.9",
    # Renders the Markdown documentation. It arrived transitively through
    # typer -> rich; depending on that was luck, not a decision.
    "markdown-it-py>=3.0",
    # Starlette needs this to parse multipart/form-data.
    "python-multipart>=0.0.6",
    # passlib's bcrypt backend reads `bcrypt.__about__`, which 4.1 removed. Pin
    # below it, or passlib raises on first use and Hash falls back to PBKDF2.
    "passlib>=1.7",
    "bcrypt>=4.0,<4.1",
    "faker>=20.0",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "httpx>=0.25",
]
mysql = ["pymysql>=1.1"]
redis = ["redis>=5.0"]

[project.scripts]
dev = "services.cli.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
