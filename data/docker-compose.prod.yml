version: '3.8'

services:
  db:
    # See docker-compose.yml for the full note. Two things change together
    # moving up from 15: the data directory format (dump and restore, or
    # pg_upgrade) and the mount point (18 stores data in a major-version
    # subdirectory of /var/lib/postgresql and refuses a volume at the old
    # path). In production do both in a maintenance window — a deploy is the
    # wrong place to discover either of them.
    image: postgres:18-alpine
    container_name: framework-prod-db
    environment:
      POSTGRES_USER: ${DB_USERNAME:-craft}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
      POSTGRES_DB: ${DB_DATABASE:-craft_prod}
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-craft} -d ${DB_DATABASE:-craft_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: framework-prod-app
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-craft_prod}
      - DB_USERNAME=${DB_USERNAME:-craft}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in your environment}
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
